<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Сажа — меню Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="top">
    <p class="eyebrow">Telegram Mini App · демо</p>
    <h1>Сажа</h1>
    <p class="sub">Меню и заказ без оплаты — проба для портфолио</p>
  </header>

  <main id="menu" class="menu" aria-label="Меню"></main>

  <aside class="cart" id="cartPanel">
    <h2>Заказ</h2>
    <ul id="cartList"></ul>
    <p class="total">Итого: <strong id="total">0 ₽</strong></p>
    <label class="note-label">Комментарий
      <input id="note" type="text" placeholder="Без сахара, стол у окна…" maxlength="120" />
    </label>
    <button type="button" class="cta" id="sendBtn" disabled>Отправить заказ</button>
    <p class="hint" id="hint">Добавьте позиции из меню</p>
  </aside>

  <script src="app.js"></script>
</body>
</html>
