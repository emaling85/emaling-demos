<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Заказ — Сажа</title>
  <meta name="description" content="Корзина и оформление заказа со стола в кофейне Сажа." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="page-flow" data-page="cart">
  <header class="site-header site-header--flow">
    <div class="wrap nav">
      <a class="logo" href="menu.html" data-table-link="menu.html">Сажа<span class="logo__mark">кофейня</span></a>
      <span class="table-pill">Стол <span data-table-num>1</span></span>
    </div>
  </header>

  <main>
    <div class="wrap page-hero page-hero--flow">
      <nav class="step-bar" aria-label="Шаги заказа">
        <ol>
          <li class="is-done"><span class="step-bar__n">1</span><span class="step-bar__label">Стол</span></li>
          <li class="is-done"><span class="step-bar__n">2</span><span class="step-bar__label">Меню</span></li>
          <li class="is-current" aria-current="step"><span class="step-bar__n">3</span><span class="step-bar__label">Корзина</span></li>
          <li><span class="step-bar__n">4</span><span class="step-bar__label">Оплата</span></li>
        </ol>
      </nav>
      <p class="eyebrow">Стол <span data-table-num>1</span></p>
      <h1>Ваш заказ</h1>
      <p>Проверьте состав и добавьте комментарий.</p>
    </div>

    <div class="wrap order-flow">
      <div class="empty empty--cart" id="cart-empty" hidden>
        <div class="empty__mark" aria-hidden="true">
          <svg class="empty__cup" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path class="empty__steam" d="M18 8c0 2 1.5 3 1.5 5M24 6c0 2.5 2 4 2 6.5M30 8c0 2 1.5 3 1.5 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            <path d="M12 18h24l-1.5 16.5A4 4 0 0 1 30.5 38h-13a4 4 0 0 1-4-3.5L12 18Z" stroke="currentColor" stroke-width="1.5"/>
            <path d="M36 20h3.5a3.5 3.5 0 0 1 0 7H35.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M14 22h20" stroke="currentColor" stroke-width="1" opacity=".35"/>
          </svg>
        </div>
        <p class="empty__eyebrow">Корзина</p>
        <h2>Пока ничего нет</h2>
        <p>Вернитесь в меню, выберите объём и нажмите «В заказ».</p>
        <a class="btn btn--moss" href="menu.html" data-table-link="menu.html">К меню</a>
      </div>

      <form id="cart-form" class="cart-panel" hidden>
        <div id="cart-list" class="cart-list"></div>

        <div class="form-field">
          <label for="comment">Комментарий к заказу</label>
          <textarea id="comment" name="comment" rows="2" placeholder="Альтернативное молоко, без сахара…"></textarea>
        </div>

        <div class="cart-total-row">
          <span>Итого</span>
          <strong id="cart-total">0&nbsp;₽</strong>
        </div>

        <button class="btn btn--moss btn--block" type="submit">К оплате</button>
        <a class="text-back" href="menu.html" data-table-link="menu.html">← Дополнить заказ</a>
      </form>
    </div>
  </main>

  <footer class="footer footer--compact">
    <div class="wrap">
      <span class="footer__demo">демо-кейс</span>
      <a class="footer__secondary" href="about.html">О кофейне</a>
    </div>
  </footer>

  <script src="data/menu.js"></script>
  <script src="script.js"></script>
</body>
</html>
